# shipments
#
# Shipment events. Supplies the fulfilment milestones in
# fact_order_fulfillment.

active: true

source:
  system: wms_files
  format: json
  path_glob: shipments/dt=*/*.json

load_type: incremental
primary_key: [shipment_id]
watermark_column: updated_at
order_by: [updated_at]

scd_type: none

cluster_by: [order_id]
