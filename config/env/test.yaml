# Environment config. NORTHPEAK_LANDING_ROOT is the single Spike-1 switch:
#   PASS -> gs://<bucket>/landing      FAIL -> /Volumes/<catalog>/landing/files
# Thresholds tighten toward prod: dev tolerates messy data, prod does not.
catalog: northpeak_test
landing_root: ${NORTHPEAK_LANDING_ROOT}
checkpoint_root: ${NORTHPEAK_LANDING_ROOT}/_checkpoints/test
schema_root: ${NORTHPEAK_LANDING_ROOT}/_schemas/test
dq_fail_threshold: 0.80
dq_warn_threshold: 0.95
max_parallel_entities: 4
