[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northpeak"
version = "0.1.0"
description = "Enterprise e-commerce lakehouse on Databricks — batch pipeline framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
# Spark is provided by the runtime (Databricks serverless, or the spark-dev
# container). Pinning it as a hard dependency here would fight the platform.
dev = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]
ignore = [
    "E501",   # line length is the formatter's job
    # `from pyspark.sql import functions as F` is the universal PySpark
    # convention. Renaming it to lowercase would make every transformation in
    # this repo look unfamiliar to anyone who has written Spark before.
    "N812",
    # dict(a=1, b=2) over {"a": 1, "b": 2} in the generator: entity rows have
    # 15+ fields and the kwargs form stays readable where a brace literal does
    # not. A deliberate style choice, not an oversight.
    "C408",
    # StrEnum exists in 3.11+, but `class X(str, Enum)` has different __str__
    # behaviour and these enum values are written into Delta tables. Not worth
    # a subtle serialisation change for a style point.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures and modules for their side effects, and assert on
# values a linter reads as unused.
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the Docker estate running",
    "databricks: needs a live Databricks workspace (excluded from CI)",
]
filterwarnings = [
    # PySpark on Python 3.11 is noisy about deprecations it cannot fix.
    "ignore::DeprecationWarning:pyspark.*",
]

[tool.coverage.run]
source = ["src/northpeak"]
omit = ["*/__init__.py"]
