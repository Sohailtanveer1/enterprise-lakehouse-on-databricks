[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northpeak"
version = "0.1.0"
description = "Enterprise e-commerce lakehouse on Databricks — batch pipeline framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
# Spark is provided by the runtime (Databricks serverless, or the spark-dev
# container). Pinning it as a hard dependency here would fight the platform.
dev = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "black>=24.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the Docker estate running",
    "databricks: needs a live Databricks workspace (excluded from CI)",
]
filterwarnings = [
    # PySpark on Python 3.11 is noisy about deprecations it cannot fix.
    "ignore::DeprecationWarning:pyspark.*",
]

[tool.coverage.run]
source = ["src/northpeak"]
omit = ["*/__init__.py"]
