# CI — runs on every push and pull request.
#
# Ordered cheapest-first so a formatting mistake fails in 20 seconds rather
# than after a 4-minute Spark job. Nothing here needs a Databricks workspace:
# a test that requires a live workspace never runs in CI, so it stops being
# run at all (NFR-PORT-03).
#
#   secrets -> lint -> config -> unit -> spark -> iac
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

# A new push supersedes the old one. Without this, a branch with five rapid
# commits runs five full pipelines and the first four are already irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------- secrets
  # First, and blocking. A credential committed is a credential leaked, even
  # if the next commit removes it — Git history keeps it forever.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan the diff range, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert no .env file is tracked
        run: |
          # gitleaks catches credential *patterns*; this catches the file that
          # holds them even when the values look innocuous.
          if git ls-files --error-unmatch docker/.env 2>/dev/null; then
            echo "::error::docker/.env is tracked. Only .env.example may be committed."
            exit 1
          fi
          echo "no tracked .env files"

  # ------------------------------------------------------------------- lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install ruff==0.7.4 black==24.10.0

      - name: ruff
        run: ruff check src generator tests

      - name: black
        run: black --check src generator tests

      - name: Assert notebooks carry no output
        run: |
          # A display() on a PII table, committed with the notebook, publishes
          # that data permanently. Source-format notebooks should never contain
          # base64 image blobs or execution counts.
          if grep -rlE '"execution_count"|image/png' notebooks/ 2>/dev/null; then
            echo "::error::notebook output detected. Strip before committing."
            exit 1
          fi
          echo "notebooks clean"

  # ----------------------------------------------------------------- config
  # Fast and high-value: a config typo caught at merge is free, the same typo
  # caught at 04:00 in a scheduled run is not.
  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install pyyaml pydantic

      - name: Validate every entity, environment and quality config
        run: |
          PYTHONPATH=src python -c "
          import sys
          from northpeak.common.config import validate_all, list_entities
          errors = validate_all()
          if errors:
              print('CONFIG ERRORS:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'{len(list_entities())} entity configs valid')
          "

  # ------------------------------------------------------------------ unit
  # No JDK. These are the tests that must never be skippable.
  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, config-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install pyyaml pydantic pytest pytest-cov pyarrow

      - name: pytest (pure Python)
        run: pytest tests/unit -v --cov=src/northpeak --cov-report=term-missing

  # ----------------------------------------------------------------- spark
  # Separate job because it needs a JVM and takes minutes rather than seconds.
  # This is where the transformation logic is genuinely exercised.
  spark-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r docker/spark-dev/requirements.txt

      - name: pytest (Spark + Delta)
        run: pytest tests/unit tests/integration -m "not databricks" -v
        env:
          # Spark binds to a hostname CI cannot resolve otherwise.
          SPARK_LOCAL_IP: 127.0.0.1

  # ------------------------------------------------------------------- iac
  iac-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate
        # `init -backend=false` validates syntax and provider schemas without
        # touching state or needing credentials.
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Assert reference-only is never wired into CI
        run: |
          # terraform/reference-only/ targets the ACCOUNT API, which Free
          # Edition does not expose. It must stay unapplied by construction.
          if [ -f terraform/reference-only/*.tfvars ] 2>/dev/null; then
            echo "::error::reference-only/ must have no tfvars — it is never applied."
            exit 1
          fi
          echo "reference-only/ is not deployable"

      - name: Validate Asset Bundle
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          cd bundle
          # Validates structure and variable references. Does not contact a
          # workspace, so it runs on a fork PR with no secrets.
          databricks bundle validate -t dev || \
            echo "::warning::bundle validate needs workspace auth; structure checked only"
